server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: festa-user-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

festa:
  user:
    pii-key: ${PII_ENCRYPTION_KEY:}
    auth-admin:
      base-url: ${AUTH_BASE_URL:http://localhost:8081}
      role-endpoint: /auth/admin/accounts/{id}/role
    outbox:
      poll-interval: 2s
      batch-size: 50
    rabbit:
      exchange: festa.user
      inbox-queue: user-service.inbox
      retry-queue: user-service.inbox.retry
      dlq-queue: user-service.inbox.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: festa-user-service

logging:
  level:
    root: INFO
    com.festa.user: INFO
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN