openapi: 3.1.0
info:
  title: Festa User Service
  version: v1
  description: Perfil, preferencias, consentimientos y verificación de comercios.
servers:
  - url: http://localhost:8082
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    UpdateProfileRequest:
      type: object
      properties:
        bio: { type: string, maxLength: 500 }
        avatarUrl: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 30 }

    ReplaceInterestsRequest:
      type: object
      required: [interests]
      properties:
        interests:
          type: array
          items:
            type: string
            enum: [CULTURAL, MUSICAL, DEPORTIVO, GASTRONOMICO]

    SubmitMerchantRequest:
      type: object
      required: [businessName, category, address, latitude, longitude]
      properties:
        businessName: { type: string, maxLength: 120 }
        category:
          type: string
          enum: [CULTURAL, MUSICAL, DEPORTIVO, GASTRONOMICO, OTRO]
        address: { type: string, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        description: { type: string, maxLength: 2000 }

security:
  - bearerAuth: []

paths:
  /users/me:
    get:
      summary: Perfil completo del usuario autenticado
      responses:
        '200': { description: OK }
        '401': { description: No autenticado }
    patch:
      summary: Actualiza perfil (PATCH semántico)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: OK }
        '400':
          description: Error de validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/interests:
    put:
      summary: Reemplaza intereses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceInterestsRequest' }
      responses:
        '200': { description: OK }

  /users/me/preferences:
    get:
      summary: Preferencias de plan
      responses:
        '200': { description: OK }
    put:
      summary: Actualiza preferencias
      responses:
        '200': { description: OK }

  /users/me/consents:
    get:
      summary: Último consentimiento por tipo
      responses:
        '200': { description: OK }
    post:
      summary: Registra un consentimiento
      responses:
        '200': { description: OK }

  /users/me/merchant:
    post:
      summary: Envía solicitud de comercio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitMerchantRequest' }
      responses:
        '201': { description: Creado }
        '409': { description: Ya existe perfil de comercio }
    get:
      summary: Estado de la solicitud de comercio
      responses:
        '200': { description: OK }
        '404': { description: No existe }
    patch:
      summary: Edita perfil de comercio
      responses:
        '200': { description: OK }

  /users/merchants/{id}:
    get:
      security: []
      summary: Ficha pública de comercio VERIFIED
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '404': { description: No visible }

  /users/admin/merchants:
    get:
      summary: Cola de verificación (solo admin)
      responses:
        '200': { description: OK }
        '403': { description: No autorizado }

  /users/admin/merchants/{id}/approve:
    post:
      summary: Aprueba comercio (solo admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '401': { description: Token del admin expirado }

  /users/admin/merchants/{id}/reject:
    post:
      summary: Rechaza comercio (solo admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }